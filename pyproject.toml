[project]
name = "flood-predictor"
version = "0.1.0"
description = "Ward-level urban flood predictor for Chennai"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.157.0",
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rasterio>=1.4.4",
    "shapely>=2.2.0",
    "uvicorn>=0.54.0",
    "livekit-api>=1.2.0",
    "twilio>=9.0.0",
    "python-multipart>=0.0.6",
    "httpx-sse>=0.4.0",
    "pydantic-settings>=2.3.0",
    "tenacity>=8.4.0",
    "structlog>=24.1.0",
    "pyogrio>=0.13.0",
    "fiona>=1.10.1",
    "sqlmodel>=0.0.48",
    "pywebpush>=2.5.0",
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
voice = [
    "edge-tts>=7.3.1",
    "faster-whisper>=1.2.1",
    "livekit-agents[openai,silero]>=1.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
